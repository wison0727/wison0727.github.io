baseURL = "https://wison0727.github.io/"
languageCode = "zh-cn"
title = "化工工业炉设计"
theme = "PaperMod"
enableRobotsTXT = true
paginate = 6

[params]
    env = "production"
    title = "化工工业炉设计"
    description = "专注化工工业炉设计、热工计算与工程优化"
    keywords = ["化工", "工业炉", "裂解炉", "转化炉", "加热炉", "设计"]
    author = "wison0727"
    defaultTheme = "auto"
    ShowShareButtons = true
    ShowReadingTime = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowWordCount = true
    ShowRssButtonInSectionTermList = true
    UseHugoToc = true
    disableSpecial1stPost = false
    disableScrollToTop = false
    hidemeta = false
    hideSummary = false
    showtoc = true

    [params.homeInfoParams]
        Title = "🔥 化工工业炉设计"
        Content = "专注化工行业工业炉设计与优化，涵盖裂解炉、转化炉、加热炉等各类炉型。提供从概念设计到详细工程设计的全流程技术服务。"

    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/wison0727"

    [[params.socialIcons]]
        name = "email"
        url = "mailto:wison0727@example.com"

    [params.editPost]
        URL = ""
        Text = "编辑本文"
        appendFilePath = true

    [params.assets]
        favicon = "/favicon.ico"
        disableFingerprinting = true

    [params.cover]
        hidden = false
        hiddenInList = false
        hiddenInSingle = false

    [params.label]
        icon = "🔥"
        text = "化工工业炉设计"

[menu]
    [[menu.main]]
        identifier = "posts"
        name = "文章"
        url = "/posts/"
        weight = 1

    [[menu.main]]
        identifier = "archives"
        name = "归档"
        url = "/archives/"
        weight = 2

    [[menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags/"
        weight = 3

    [[menu.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories/"
        weight = 4

    [[menu.main]]
        identifier = "search"
        name = "搜索"
        url = "/search/"
        weight = 5

    [[menu.main]]
        identifier = "about"
        name = "关于"
        url = "/about/"
        weight = 6

[outputs]
    home = ["HTML", "RSS", "JSON"]

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.highlight]
        codeFences = true
        guessSyntax = true
        lineNos = true
        style = "monokai"

[minify]
    disableCSS = false
    disableHTML = false
    disableJS = false
    disableSVG = false
    minifyOutput = true