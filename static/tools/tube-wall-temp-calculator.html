<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炉管壁温计算器 - 化工工业炉设计</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #8e44ad; margin: 30px 0; font-size: 1.8em; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { color: #2c3e50; margin-bottom: 16px; font-size: 1.2em; border-left: 4px solid #8e44ad; padding-left: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #8e44ad; }
        .row { display: flex; gap: 16px; }
        .row .form-group { flex: 1; }
        .btn { background: #8e44ad; color: #fff; border: none; padding: 12px 32px; border-radius: 6px; font-size: 16px; cursor: pointer; display: block; width: 100%; }
        .btn:hover { background: #9b59b6; }
        .btn-pdf { background: #16a34a; margin-top: 12px; }
        .btn-pdf:hover { background: #22c55e; }
        .result { background: #f4f0f8; border: 2px solid #8e44ad; border-radius: 8px; padding: 20px; margin-top: 16px; display: none; }
        .result.show { display: block; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; }
        .result-item:last-child { border: none; }
        .result-label { color: #666; }
        .result-value { font-weight: 700; color: #8e44ad; font-size: 1.1em; }
        .tip { background: #fef9e7; border-left: 4px solid #f39c12; padding: 12px 16px; margin-top: 16px; border-radius: 0 6px 6px 0; font-size: 13px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8e44ad; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .warn { color: #e74c3c; font-weight: 700; }
        .ok { color: #27ae60; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← 返回首页</a>
    <h1>🔧 炉管壁温计算器</h1>

    <div class="card">
        <h2>工艺参数</h2>
        <div class="row">
            <div class="form-group">
                <label>管内介质温度 (°C)</label>
                <input type="number" id="processTemp" placeholder="如 500">
            </div>
            <div class="form-group">
                <label>管内膜传热系数 hi (W/m²·K)</label>
                <input type="number" id="hi" placeholder="如 1500" value="1500">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>炉管参数</h2>
        <div class="form-group">
            <label>炉管材质</label>
            <select id="material" onchange="updateK()">
                <option value="20" data-k="45">20# 碳钢 (λ=45)</option>
                <option value="Cr5Mo" data-k="38">5Cr-0.5Mo (λ=38)</option>
                <option value="Cr9Mo" data-k="30">9Cr-1Mo (λ=30)</option>
                <option value="HK40" data-k="18" selected>HK40 (λ=18)</option>
                <option value="HP" data-k="16">HP Modified (λ=16)</option>
            </select>
        </div>
        <div class="row">
            <div class="form-group">
                <label>外径 Do (mm)</label>
                <input type="number" id="outerDia" placeholder="如 141" value="141">
            </div>
            <div class="form-group">
                <label>壁厚 t (mm)</label>
                <input type="number" id="wallThick" placeholder="如 10" value="10">
            </div>
        </div>
        <div class="form-group">
            <label>外壁热通量 q (kW/m²)</label>
            <input type="number" id="heatFlux" step="0.1" placeholder="如 35">
        </div>
    </div>

    <button class="btn" onclick="calculate()">计算壁温</button>

    <div class="result" id="result">
        <h2>📊 计算结果</h2>
        <div class="result-item">
            <span class="result-label">管外壁温度 Tw,o</span>
            <span class="result-value" id="rTwo">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">管内壁温度 Tw,i</span>
            <span class="result-value" id="rTwi">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">金属平均壁温</span>
            <span class="result-value" id="rTavg">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">管壁温差 ΔT_wall</span>
            <span class="result-value" id="rDTwall">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">材质评估</span>
            <span id="rAssess">-</span>
        </div>
        <button class="btn btn-pdf" onclick="downloadPDF()">&#128196; 导出 PDF 报告</button>
    </div>

    <div class="tip">
        💡 <strong>计算公式</strong>：Tw,i = T_process + q/hi；Tw,o = Tw,i + q×(Do/2)/(λ×1000)×ln(Do/(Do-2t))。材质许用温度为经验值，请参考相关标准。
    </div>
</div>

<script>
function updateK() {}

const maxTemps = { '20': 450, 'Cr5Mo': 550, 'Cr9Mo': 630, 'HK40': 1050, 'HP': 1100 };

function calculate() {
    const Tprocess = parseFloat(document.getElementById('processTemp').value);
    const hi = parseFloat(document.getElementById('hi').value);
    const Do = parseFloat(document.getElementById('outerDia').value);
    const t = parseFloat(document.getElementById('wallThick').value);
    const q = parseFloat(document.getElementById('heatFlux').value) * 1000; // W/m²
    const mat = document.getElementById('material').value;
    const k = parseFloat(document.querySelector('#material option:checked').dataset.k);

    if (isNaN(Tprocess) || isNaN(hi) || isNaN(Do) || isNaN(t) || isNaN(q)) {
        alert('请填写完整参数');
        return;
    }

    const Di = Do - 2 * t;
    const Twi = Tprocess + q / hi;
    const Two = Twi + q * (Do / 2000) / k * Math.log(Do / Di);
    const Tavg = (Twi + Two) / 2;

    document.getElementById('rTwo').textContent = Two.toFixed(1) + ' °C';
    document.getElementById('rTwi').textContent = Twi.toFixed(1) + ' °C';
    document.getElementById('rTavg').textContent = Tavg.toFixed(1) + ' °C';
    document.getElementById('rDTwall').textContent = (Two - Twi).toFixed(1) + ' °C';

    const assess = document.getElementById('rAssess');
    const maxT = maxTemps[mat];
    if (Two > maxT) {
        assess.innerHTML = '<span class="warn">❌ 超温! 外壁 ' + Two.toFixed(0) + '°C 超过 ' + mat + ' 许用温度 ' + maxT + '°C</span>';
    } else {
        assess.innerHTML = '<span class="ok">✅ 安全 — 许用温度 ' + maxT + '°C，余量 ' + (maxT - Two).toFixed(0) + '°C</span>';
    }

    document.getElementById('result').classList.add('show');
}

function _generatePDF(title, resultId, inputCfg) {
    if (!document.getElementById(resultId).classList.contains('show')) { alert('请先进行计算！'); return; }
    var ACCENT = '#8e44ad';
    var FONT = '"Microsoft YaHei","SimHei",Arial,sans-serif';
    var HEADER_BG = '#f4f0f8';
    var rows = '';
    inputCfg.forEach(function(item) {
        var val = item.fn ? item.fn() : (document.getElementById(item.id) || {}).value;
        if (val == null || val === '') return;
        rows += '<tr><td style="padding:4px 10px;color:#555;width:40%;border-bottom:1px solid #eee;">' + item.label + '</td>' +
                '<td style="padding:4px 10px;font-weight:600;border-bottom:1px solid #eee;">' + val + (item.unit ? ' ' + item.unit : '') + '</td></tr>';
    });
    var container = document.createElement('div');
    container.style.cssText = 'padding:30px 36px;font-family:' + FONT + ';color:#1a1a2e;line-height:1.5;background:#fff;width:720px;';
    container.innerHTML =
        '<div style="text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid ' + ACCENT + ';">' +
        '<h1 style="font-size:18px;margin:0 0 4px;color:' + ACCENT + ';">' + title + '</h1>' +
        '<p style="margin:0;font-size:11px;color:#666;">计算日期：' + new Date().toLocaleString('zh-CN') + '</p></div>' +
        '<div style="margin-bottom:14px;"><div style="background:' + HEADER_BG + ';padding:5px 10px;font-weight:700;color:#2c3e50;font-size:13px;border-radius:4px 4px 0 0;">输入参数</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' + rows + '</table></div>' +
        document.getElementById(resultId).outerHTML.replace('display: none','').replace('style="display:none"','');
    document.body.appendChild(container);
    html2canvas(container, {scale:2, useCORS:true, backgroundColor:'#ffffff'}).then(function(canvas) {
        document.body.removeChild(container);
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
        var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
        var m = 10, cw = pageW - m*2, ih = (canvas.height/canvas.width)*cw;
        if (m + ih + 10 <= pageH) { pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',m,m,cw,ih); }
        else { var avail = pageH - m*2, slices = Math.ceil(ih/avail), sh = canvas.height/slices;
            for (var s=0;s<slices;s++){if(s>0)pdf.addPage();var sc=document.createElement('canvas');sc.width=canvas.width;sc.height=Math.round(sh);
            sc.getContext('2d').drawImage(canvas,0,Math.round(s*sh),canvas.width,sc.height,0,0,canvas.width,sc.height);
            pdf.addImage(sc.toDataURL('image/jpeg',0.95),'JPEG',m,m,cw,(sc.height/sc.width)*cw);} }
        pdf.setFontSize(8); pdf.setTextColor(180,180,180); pdf.text('wison0727.github.io',pageW/2,pageH-6,{align:'center'});
        pdf.setProperties({title:title, author:'wison0727'});
        var fname = title + '_' + new Date().toISOString().slice(0,10) + '.pdf';
        var a = document.createElement('a'); a.href = URL.createObjectURL(pdf.output('blob')); a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
}

function downloadPDF() {
    var sel = document.getElementById('material');
    var matName = sel.options[sel.selectedIndex].text;
    _generatePDF('炉管壁温计算报告', 'result', [
        {label:'管内介质温度', id:'processTemp', unit:'°C'},
        {label:'内膜传热系数 hi', id:'hi', unit:'W/m²·K'},
        {label:'炉管材质', fn:function(){return matName;}},
        {label:'外径 Do', id:'outerDia', unit:'mm'},
        {label:'壁厚 t', id:'wallThick', unit:'mm'},
        {label:'外壁热通量 q', id:'heatFlux', unit:'kW/m²'}
    ]);
}
</script>
</body>
</html>
