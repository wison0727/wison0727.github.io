<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风荷载计算器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; margin: 30px 0; font-size: 1.8em; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { color: #2c3e50; margin-bottom: 16px; font-size: 1.2em; border-left: 4px solid #2c3e50; padding-left: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .row { display: flex; gap: 16px; }
        .row .form-group { flex: 1; }
        .btn { background: #2c3e50; color: #fff; border: none; padding: 12px 32px; border-radius: 6px; font-size: 16px; cursor: pointer; display: block; width: 100%; }
        .btn:hover { background: #34495e; }
        .btn-pdf { background: #16a34a; margin-top: 12px; }
        .btn-pdf:hover { background: #22c55e; }
        .result { background: #eaf2f8; border: 2px solid #2c3e50; border-radius: 8px; padding: 20px; margin-top: 16px; display: none; }
        .result.show { display: block; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; }
        .result-item:last-child { border: none; }
        .result-label { color: #666; }
        .result-value { font-weight: 700; color: #2c3e50; font-size: 1.1em; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2c3e50; text-decoration: none; }
        .tip { background: #fef9e7; border-left: 4px solid #f39c12; padding: 12px 16px; margin-top: 16px; border-radius: 0 6px 6px 0; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <a href="/tools/" class="back-link">← 返回工具列表</a>
    <h1>💨 钢结构风荷载计算器</h1>
    <div class="card">
        <h2>参数输入</h2>
        <div class="row">
            <div class="form-group">
                <label>基本风速 V₀ (m/s)</label>
                <input type="number" id="windSpeed" value="30" step="0.5">
            </div>
            <div class="form-group">
                <label>地面粗糙度</label>
                <select id="roughness">
                    <option value="0.12" selected>A类（海面/沙漠）</option>
                    <option value="0.15">B类（田野/乡村）</option>
                    <option value="0.22">C类（城市/密集建筑）</option>
                    <option value="0.30">D类（大城市中心）</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>受风面宽度 B (m)</label>
                <input type="number" id="width" value="6" step="0.1">
            </div>
            <div class="form-group">
                <label>受风面高度 H (m)</label>
                <input type="number" id="height" value="15" step="0.1">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>体型系数 μs</label>
                <input type="number" id="muS" value="1.3" step="0.1">
            </div>
            <div class="form-group">
                <label>风压高度变化系数 μz</label>
                <input type="number" id="muZ" value="1.25" step="0.01">
            </div>
        </div>
        <div class="form-group">
            <label>风振系数 βz</label>
            <input type="number" id="betaZ" value="1.0" step="0.01" placeholder="一般结构取1.0，高耸结构需计算">
        </div>
    </div>
    <button class="btn" onclick="calculate()">计算风荷载</button>
    <div class="result" id="result">
        <h2>📊 计算结果</h2>
        <div class="result-item">
            <span class="result-label">风压 W₀</span>
            <span class="result-value" id="rW0">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">风荷载标准值 Wk</span>
            <span class="result-value" id="rWk">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">受风面积</span>
            <span class="result-value" id="rArea">-</span>
        </div>
        <div class="result-item">
            <span class="result-label">总风力 F</span>
            <span class="result-value" id="rForce">-</span>
        </div>
        <button class="btn btn-pdf" onclick="downloadPDF()">&#128196; 导出 PDF 报告</button>
    </div>
    <div class="tip">
        💡 <strong>公式</strong>：Wk = βz × μs × μz × W₀，W₀ = 0.5 × ρ × V₀² (ρ≈1.25 kg/m³)，F = Wk × A。参考 GB 50009-2012《建筑结构荷载规范》。
    </div>
</div>
<script>
function calculate() {
    const V = parseFloat(document.getElementById('windSpeed').value);
    const muS = parseFloat(document.getElementById('muS').value);
    const muZ = parseFloat(document.getElementById('muZ').value);
    const betaZ = parseFloat(document.getElementById('betaZ').value);
    const B = parseFloat(document.getElementById('width').value);
    const H = parseFloat(document.getElementById('height').value);
    if (isNaN(V) || isNaN(B) || isNaN(H)) { alert('请填写完整参数'); return; }
    const W0 = 0.5 * 1.25 * V * V;
    const Wk = betaZ * muS * muZ * W0;
    const A = B * H;
    const F = Wk * A;
    document.getElementById('rW0').textContent = W0.toFixed(1) + ' Pa';
    document.getElementById('rWk').textContent = Wk.toFixed(1) + ' Pa';
    document.getElementById('rArea').textContent = A.toFixed(1) + ' m²';
    document.getElementById('rForce').textContent = (F / 1000).toFixed(2) + ' kN';
    document.getElementById('result').classList.add('show');
}

function _generatePDF(title, resultId, inputCfg) {
    if (!document.getElementById(resultId).classList.contains('show')) { alert('请先进行计算！'); return; }
    var ACCENT = '#2c3e50';
    var FONT = '"Microsoft YaHei","SimHei",Arial,sans-serif';
    var HEADER_BG = '#eaf2f8';
    var rows = '';
    inputCfg.forEach(function(item) {
        var val = item.fn ? item.fn() : (document.getElementById(item.id) || {}).value;
        if (val == null || val === '') return;
        rows += '<tr><td style="padding:4px 10px;color:#555;width:40%;border-bottom:1px solid #eee;">' + item.label + '</td>' +
                '<td style="padding:4px 10px;font-weight:600;border-bottom:1px solid #eee;">' + val + (item.unit ? ' ' + item.unit : '') + '</td></tr>';
    });
    var container = document.createElement('div');
    container.style.cssText = 'padding:30px 36px;font-family:' + FONT + ';color:#1a1a2e;line-height:1.5;background:#fff;width:720px;';
    container.innerHTML =
        '<div style="text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid ' + ACCENT + ';">' +
        '<h1 style="font-size:18px;margin:0 0 4px;color:' + ACCENT + ';">' + title + '</h1>' +
        '<p style="margin:0;font-size:11px;color:#666;">计算日期：' + new Date().toLocaleString('zh-CN') + '</p></div>' +
        '<div style="margin-bottom:14px;"><div style="background:' + HEADER_BG + ';padding:5px 10px;font-weight:700;color:#2c3e50;font-size:13px;border-radius:4px 4px 0 0;">输入参数</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' + rows + '</table></div>' +
        document.getElementById(resultId).outerHTML.replace('display: none','').replace('style="display:none"','');
    document.body.appendChild(container);
    html2canvas(container, {scale:2, useCORS:true, backgroundColor:'#ffffff'}).then(function(canvas) {
        document.body.removeChild(container);
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
        var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
        var m = 10, cw = pageW - m*2, ih = (canvas.height/canvas.width)*cw;
        if (m + ih + 10 <= pageH) { pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',m,m,cw,ih); }
        else { var avail = pageH - m*2, slices = Math.ceil(ih/avail), sh = canvas.height/slices;
            for (var s=0;s<slices;s++){if(s>0)pdf.addPage();var sc=document.createElement('canvas');sc.width=canvas.width;sc.height=Math.round(sh);
            sc.getContext('2d').drawImage(canvas,0,Math.round(s*sh),canvas.width,sc.height,0,0,canvas.width,sc.height);
            pdf.addImage(sc.toDataURL('image/jpeg',0.95),'JPEG',m,m,cw,(sc.height/sc.width)*cw);} }
        pdf.setFontSize(8); pdf.setTextColor(180,180,180); pdf.text('wison0727.github.io',pageW/2,pageH-6,{align:'center'});
        pdf.setProperties({title:title, author:'wison0727'});
        var fname = title + '_' + new Date().toISOString().slice(0,10) + '.pdf';
        var a = document.createElement('a'); a.href = URL.createObjectURL(pdf.output('blob')); a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
}

function downloadPDF() {
    var sel = document.getElementById('roughness');
    var roughName = sel.options[sel.selectedIndex].text;
    _generatePDF('钢结构风荷载计算报告', 'result', [
        {label:'基本风速 V₀', id:'windSpeed', unit:'m/s'},
        {label:'地面粗糙度', fn:function(){return roughName;}},
        {label:'受风面宽度 B', id:'width', unit:'m'},
        {label:'受风面高度 H', id:'height', unit:'m'},
        {label:'体型系数 μs', id:'muS'},
        {label:'风压高度变化系数 μz', id:'muZ'},
        {label:'风振系数 βz', id:'betaZ'}
    ]);
}
</script>
</body>
</html>
