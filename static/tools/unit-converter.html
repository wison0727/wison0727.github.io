<body>
<div class="container">
    <a href="/" class="back-link">← 返回首页</a>
    <h1>🔄 在线单位换算</h1>

    <div class="card">
        <div class="category-tabs" id="categoryTabs"></div>

        <div class="form-group">
            <label>精度（小数位数）</label>
            <input type="number" id="precision" value="6" min="0" max="15" oninput="doConvert()">
        </div>

        <div class="row">
            <div class="form-group">
                <label>数据</label>
                <input type="number" id="inputValue" oninput="doConvert()" placeholder="输入数值">
            </div>
            <div class="form-group" style="flex:0 0 160px;">
                <label>单位</label>
                <select id="fromUnit" onchange="doConvert()"></select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>结果</label>
                <input type="text" id="resultValue" readonly placeholder="—">
            </div>
            <div class="form-group" style="flex:0 0 160px;">
                <label>单位</label>
                <select id="toUnit" onchange="doConvert()"></select>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="swapUnits()">交换</button>
            <button class="btn" onclick="copyResult()">复制</button>
            <button class="btn" onclick="clearAll()">清空</button>
            <button class="btn btn-pdf" onclick="downloadPDF()">导出 PDF</button>
        </div>
    </div>

    <div class="tip">
        <strong>说明</strong>：本工具支持化工工业炉设计中常用的各种单位换算，涵盖热量、压力、温度、流量、长度、面积、体积、质量、数据存储等类别。输入数值后自动实时转换。

// ==================== 温度特殊转换 ====================
function tempConvert(val, from, to) {
    if (from === to) return val;
    // 先转到 °C
    let c;
    switch (from) {
        case 'c': c = val; break;
        case 'f': c = (val - 32) * 5/9; break;
        case 'k': c = val - 273.15; break;
        case 'r': c = (val - 491.67) * 5/9; break;
    }
    // 从 °C 转到目标
    switch (to) {
        case 'c': return c;
        case 'f': return c * 9/5 + 32;
        case 'k': return c + 273.15;
        case 'r': return (c + 273.15) * 9/5;
    }
}

// ==================== 状态管理 ====================
let currentCategory = '热量/能量';

// ==================== 初始化 ====================
function init() {
    const tabs = document.getElementById('categoryTabs');
    tabs.innerHTML = '';
    Object.keys(UNIT_DB).forEach(cat => {
        const tab = document.createElement('span');
        tab.className = 'category-tab' + (cat === currentCategory ? ' active' : '');
        tab.textContent = cat;
        tab.onclick = () => switchCategory(cat);
        tabs.appendChild(tab);
    });
    populateUnits();
}

function switchCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.category-tab').forEach(t => {
        t.classList.toggle('active', t.textContent === cat);
    });
    populateUnits();
    document.getElementById('resultValue').value = '';
}

function populateUnits() {
    const db = UNIT_DB[currentCategory];
    const fromSel = document.getElementById('fromUnit');
    const toSel = document.getElementById('toUnit');
    fromSel.innerHTML = '';
    toSel.innerHTML = '';
    db.units.forEach((u, i) => {
        const o1 = document.createElement('option');
        o1.value = u.id; o1.textContent = u.name;
        fromSel.appendChild(o1);
        const o2 = document.createElement('option');
        o2.value = u.id; o2.textContent = u.name;
        toSel.appendChild(o2);
    });
    // 默认: 第一个 → 第二个
    if (db.units.length >= 2) toSel.selectedIndex = 1;
}

// ==================== 核心换算 ====================
function doConvert() {
    const db = UNIT_DB[currentCategory];
    const val = parseFloat(document.getElementById('inputValue').value);
    const from = document.getElementById('fromUnit').value;
    const to = document.getElementById('toUnit').value;
    const prec = parseInt(document.getElementById('precision').value) || 6;

    if (isNaN(val)) {
        document.getElementById('resultValue').value = '';
        return;
    }

    let result;
    if (db.special && currentCategory === '温度') {
        result = tempConvert(val, from, to);
    } else if (db.special && currentCategory === '密度' && (from === 'apil' || to === 'apil')) {
        result = apiConvert(val, from, to);
    } else {
        const fromUnit = db.units.find(u => u.id === from);
        const toUnit = db.units.find(u => u.id === to);
        const baseVal = val * fromUnit.factor;
        result = baseVal / toUnit.factor;
    }

    // 格式化
    const formatted = formatNumber(result, prec);
    document.getElementById('resultValue').value = formatted;
}

function apiConvert(val, from, to) {
    // °API = 141.5 / SG - 131.5；SG = 141.5 / (°API + 131.5)
    if (from === 'apil' && to === 'apil') return val;
    if (from === 'apil') {
        const sg = 141.5 / (val + 131.5);
        return sg; // 返回 SG (kg/L)
    }
    if (to === 'apil') {
        const sg = val; // 输入为 kg/L (SG)
        return 141.5 / sg - 131.5;
    }
    return val;
}

function formatNumber(num, decimals) {
    if (num === 0) return '0';
    const abs = Math.abs(num);
    // 对于极大或极小的数用科学记数法
    if (abs >= 1e12 || (abs > 0 && abs < 1e-6)) {
        return num.toExponential(decimals);
    }
    // 普通数字：去除尾部0
    const fixed = num.toFixed(decimals);
    return parseFloat(fixed).toString();
}

// ==================== 操作按钮 ====================
function swapUnits() {
    const fromSel = document.getElementById('fromUnit');
    const toSel = document.getElementById('toUnit');
    const tmp = fromSel.value;
    fromSel.value = toSel.value;
    toSel.value = tmp;
    doConvert();
}

function copyResult() {
    const val = document.getElementById('resultValue').value;
    if (!val) return;
    navigator.clipboard.writeText(val).then(() => {
        const btn = event.target;
        btn.textContent = '已复制 ✓';
        setTimeout(() => btn.textContent = '复制', 1500);
    });
}

function clearAll() {
    document.getElementById('inputValue').value = '';
    document.getElementById('resultValue').value = '';
    document.getElementById('precision').value = '6';
}

    const prec = document.getElementById('precision').value;

    const fromName = fromSel.options[fromSel.selectedIndex].text;
    const toName = toSel.options[toSel.selectedIndex].text;
    const db = UNIT_DB[currentCategory];

    var ACCENT = '#16a085';
    var FONT = '"Microsoft YaHei","SimHei",Arial,sans-serif';
    var HEADER_BG = '#e8f8f5';

    var container = document.createElement('div');
    container.style.cssText = 'padding:30px 36px;font-family:' + FONT + ';color:#1a1a2e;line-height:1.5;background:#fff;width:720px;';
    container.innerHTML =
        '<div style="text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid ' + ACCENT + ';">' +
        '<h1 style="font-size:18px;margin:0 0 4px;color:' + ACCENT + ';">单位换算报告</h1>' +
        '<p style="margin:0;font-size:11px;color:#666;">类别：' + currentCategory + '  |  计算日期：' + new Date().toLocaleString('zh-CN') + '</p></div>' +
        '<div style="margin-bottom:14px;"><div style="background:' + HEADER_BG + ';padding:5px 10px;font-weight:700;color:#2c3e50;font-size:13px;border-radius:4px 4px 0 0;">换算结果</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
        '<tr><td style="padding:6px 10px;color:#555;width:35%;border-bottom:1px solid #eee;">输入值</td><td style="padding:6px 10px;font-weight:600;border-bottom:1px solid #eee;">' + val + ' ' + fromName + '</td></tr>' +
        '<tr><td style="padding:6px 10px;color:#555;border-bottom:1px solid #eee;">结果</td><td style="padding:6px 10px;font-weight:700;color:' + ACCENT + ';font-size:15px;border-bottom:1px solid #eee;">' + result + ' ' + toName + '</td></tr>' +
        '<tr><td style="padding:6px 10px;color:#555;">精度</td><td style="padding:6px 10px;">' + prec + ' 位小数</td></tr>' +
        '</table></div>' +
        '<div style="background:#f0f9f4;border-left:4px solid ' + ACCENT + ';padding:10px 14px;font-size:12px;color:#555;border-radius:0 4px 4px 0;">' +
        '<strong>换算公式：</strong> ' + (db.formula || '') + '</div>';

    document.body.appendChild(container);

    html2canvas(container, {scale:2, useCORS:true, backgroundColor:'#ffffff'}).then(function(canvas) {
        document.body.removeChild(container);
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
        var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
        var m = 10, cw = pageW - m*2, ih = (canvas.height/canvas.width)*cw;
        if (m + ih + 10 <= pageH) {
            pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',m,m,cw,ih);
        } else {
            var avail = pageH - m*2, slices = Math.ceil(ih/avail), sh = canvas.height/slices;
            for (var s=0;s<slices;s++){
                if(s>0) pdf.addPage();
                var sc = document.createElement('canvas');
                sc.width = canvas.width; sc.height = Math.round(sh);
                sc.getContext('2d').drawImage(canvas,0,Math.round(s*sh),canvas.width,sc.height,0,0,canvas.width,sc.height);
                pdf.addImage(sc.toDataURL('image/jpeg',0.95),'JPEG',m,m,cw,(sc.height/sc.width)*cw);
            }
        }
        pdf.setFontSize(8); pdf.setTextColor(180,180,180);
        pdf.text('wison0727.github.io',pageW/2,pageH-6,{align:'center'});
        var fname = '单位换算_' + currentCategory + '_' + new Date().toISOString().slice(0,10) + '.pdf';
        var a = document.createElement('a'); a.href = URL.createObjectURL(pdf.output('blob')); a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
}

// ==================== 启动 ====================
init();
</script>
